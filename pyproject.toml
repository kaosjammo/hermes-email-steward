[build-system]
requires = ["setuptools>=80.9,<81", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-email-steward"
version = "0.1.0"
description = "Private owner-controlled Gmail triage plugin for Hermes"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.133.1,<0.134"]

[project.optional-dependencies]
test = ["httpx>=0.28.1,<0.29", "pytest>=8.4.2,<9", "PyYAML>=6.0.3,<7", "build>=1.3,<2", "ruamel.yaml>=0.18.17,<0.19", "python-dotenv>=1.2.1,<2", "rich>=14.2,<15", "uvicorn>=0.54,<0.55", "python-multipart>=0.0.32,<0.1", "openai>=2.54,<3", "psutil>=7.2.2,<8", "requests>=2.34.2,<3", "websockets>=15.0.1,<16", "aiohttp>=3.14.5,<4", "discord.py>=2.7.1,<3", "python-telegram-bot[webhooks]>=22.8,<23", "slack-bolt>=1.30,<2", "slack-sdk>=3.45,<4", "mautrix>=0.21.1,<0.22", "Markdown>=3.11,<4", "lark-oapi>=1.7.5,<2", "wcwidth>=0.2.13,<0.3", "microsoft-teams-apps>=2.1.1,<3", "google-api-python-client>=2.201,<3", "google-auth>=2.62,<3", "google-auth-httplib2>=0.4.4,<0.5", "google-cloud-pubsub>=2.43,<3", "httplib2>=0.32,<0.33", "cryptography>=50.0.2,<51"]

[tool.setuptools.packages.find]
include = ["email_steward*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = ".local/backend/pytest-cache"
