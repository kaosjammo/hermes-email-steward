name: backend-local-contracts
on:
  push:
    paths: ['email_steward/**', 'dashboard/**', 'desktop/**', 'docs/**', 'README.md', '__init__.py', 'MANIFEST.in', 'tests/**', 'scripts/**', 'plugin.yaml', 'pyproject.toml', 'requirements.lock', '.github/workflows/backend.yml']
  pull_request:
    paths: ['email_steward/**', 'dashboard/**', 'desktop/**', 'docs/**', 'README.md', '__init__.py', 'MANIFEST.in', 'tests/**', 'scripts/**', 'plugin.yaml', 'pyproject.toml', 'requirements.lock', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  synthetic-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Read-only reference SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: .local/hermes-sdk
          persist-credentials: false
      - name: Native parser prerequisites
        run: |
          mkdir -p .local/tmp
          export TMPDIR="$PWD/.local/tmp"
          sudo apt-get update
          sudo apt-get install -y libseccomp2 qpdf poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: scripts/setup.sh
      - run: scripts/package.sh
      - name: Offline installed-wheel worker and parser
        run: .local/backend/venv/bin/python scripts/qualify_wheel.py --wheel .local/backend/dist/hermes_email_steward-0.1.0-py3-none-any.whl --root .local/wheel-smoke
      - run: scripts/test.sh
        env:
          HERMES_UPSTREAM: ${{ github.workspace }}/.local/hermes-sdk
          ES_DISTRIBUTION_DIR: ${{ github.workspace }}/.local/backend/dist
      - name: Actual Hermes validation and discovery
        run: TMPDIR="$PWD/.local/tmp" .local/backend/venv/bin/python scripts/validate_hermes.py --upstream .local/hermes-sdk
      - name: Install the released host with its frozen package manager lock
        run: |
          python -m pip install uv==0.11.29
          UV_PROJECT_ENVIRONMENT="$PWD/.local/released-host-venv" UV_CACHE_DIR="$PWD/.local/uv-cache" TMPDIR="$PWD/.local/tmp" uv sync --project .local/hermes-sdk --frozen --no-dev --extra web --extra discord
      - name: Packaged production cron delivery, default and named profiles
        run: |
          .local/released-host-venv/bin/python tests/cron_host_probe.py --root .local/cron-default --bundle .local/backend/dist/email-steward-plugin-0.1.0.tar.gz
          .local/released-host-venv/bin/python tests/cron_host_probe.py --root .local/cron-named --profile steward-test --bundle .local/backend/dist/email-steward-plugin-0.1.0.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Shipped Desktop rules and rendered interactions
        env:
          ES_PYTHON: ${{ github.workspace }}/.local/backend/venv/bin/python
          ES_UI_TMPDIR: .local/tmp
          # Use the runner's installed Chrome sandbox helper for pinned Chromium.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          test "$(stat -c '%u:%a' "$CHROME_DEVEL_SANDBOX")" = '0:4755'
          node tests/desktop/setup.mjs --browser
          node --test tests/desktop/environment.test.mjs
          node --experimental-loader ./tests/desktop/loader.mjs tests/desktop/rules.test.mjs
          node tests/desktop/run-browser.mjs
      - name: Preserve synthetic qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-release-qualification
          path: |
            .local/cron-default/RESULT.json
            .local/cron-default/COMMANDS.json
            .local/cron-named/RESULT.json
            .local/cron-named/COMMANDS.json
            .local/evidence/desktop
          include-hidden-files: true
